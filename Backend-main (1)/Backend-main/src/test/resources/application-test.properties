spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# En tests SI dejamos que Hibernate genere el esquema, porque es una BD
# desechable en memoria que se recrea en cada corrida. El indice parcial
# anti-sobreocupacion no se prueba aqui a nivel de constraint de BD, sino
# a traves del lock pesimista + la logica de ReservationService (ver
# ReservationServiceIntegrationTest.shouldRejectReservationWhenSlotAlreadyTaken).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

server.error.include-message=always
