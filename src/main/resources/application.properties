spring.config.import=optional:file:.env[.properties]
spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservas_db}?sslmode=${DB_SSL_MODE:prefer}&user=${DB_USERNAME:postgres}&password=${DB_PASSWORD:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema real se crea con el script firmado en T-A2-04
# (Modelo_Fisico_PostgreSQL.sql), que incluye el indice unico parcial
# anti-sobreocupacion que Hibernate no puede generar por si solo.
# Por eso usamos 'validate' en vez de 'update': si el codigo Java y la
# base de datos real se desalinean, la app falla al arrancar en vez de
# crear tablas duplicadas silenciosamente.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always
server.port=${PORT:${SERVER_PORT:8080}}
